<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projekte — S. Seclen</title>
<meta name="description" content="Zwei interaktive Web-Tools von Salvattore Seclen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F5F2;
    --ink:#2B2E2C;
    --muted:#7A8079;
    --line:#DEDBD3;
    --accent:#6E8B7A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:0 28px;
    width:100%;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .mark{
    font-size:.72rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
    padding:40px 0 0;
  }
  h1{
    font-size:clamp(1.6rem, 3vw, 2.1rem);
    font-weight:500;
    letter-spacing:-.01em;
    margin:18px 0 4px;
    color:var(--ink);
  }
  .sub{
    color:var(--muted);
    font-size:.95rem;
    margin-bottom:48px;
    max-width:32ch;
  }
  .links{
    border-top:1px solid var(--line);
  }
  .link-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:24px;
    padding:28px 0;
    border-bottom:1px solid var(--line);
    text-decoration:none;
    color:var(--ink);
    transition:padding-left .2s ease, color .2s ease;
  }
  .link-row:hover{
    padding-left:6px;
    color:var(--accent);
  }
  .link-num{
    font-size:.72rem;
    color:var(--muted);
    letter-spacing:.08em;
    min-width:28px;
  }
  .link-main{ flex:1; }
  .link-title{
    font-size:1.15rem;
    font-weight:500;
  }
  .link-desc{
    font-size:.85rem;
    color:var(--muted);
    margin-top:4px;
    line-height:1.4;
  }
  .link-arrow{
    font-size:1rem;
    color:var(--muted);
    transition:transform .2s ease;
  }
  .link-row:hover .link-arrow{
    transform:translateX(3px);
    color:var(--accent);
  }
  footer{
    text-align:center;
    padding:28px;
    font-size:.75rem;
    color:var(--muted);
  }
  footer a{
    color:var(--muted);
    text-decoration:underline;
    text-underline-offset:3px;
  }
  footer a:hover{ color:var(--accent); }
  a:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body>

  <div class="wrap">
    <p class="mark">Projekte</p>
    <h1>Zwei Web-Tools</h1>
    <p class="sub">Gebaut mit HTML, Tailwind CSS und JavaScript — ohne Frameworks.</p>

    <div class="links">
      <a href="support-dashboard.html" class="link-row">
        <span class="link-num">01</span>
        <span class="link-main">
          <span class="link-title">IT-Support-Dashboard</span>
          <div class="link-desc">Ticket-Queue mit Filtern, Live-Suche und System-Monitoring</div>
        </span>
        <span class="link-arrow">→</span>
      </a>

      <a href="rollout-checklist.html" class="link-row">
        <span class="link-num">02</span>
        <span class="link-main">
          <span class="link-title">Rollout-Checklisten-Generator</span>
          <div class="link-desc">Checklisten je Arbeitsplatz-Typ, exportierbar als Markdown</div>
        </span>
        <span class="link-arrow">→</span>
      </a>
    </div>
  </div>

  <footer>
    <a href="mailto:salvaseclen@gmail.com">salvaseclen@gmail.com</a>
  </footer>

</body>
</html>
